<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F9F9FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A+ Study">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>A+ Study Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free CompTIA A+, Linux+ and Project+ study app: lessons, flashcards and quizzes. Works offline.">
<style>
/* Layout: one centred iOS-style column, large titles, inset grouped lists, fixed bottom tab bar. */
:root {
  --bg: #F2F2F6;
  --card: #FFFFFF;
  --fill: #E8E8ED;
  --fg: #121216;
  --fg2: #66666E;
  --sep: #D8D8DE;
  --accent: #0A62CC;
  --on-accent: #FFFFFF;
  --good: #1D7F38;
  --good-bg: #E3F3E7;
  --bad: #C02B24;
  --bad-bg: #FBE6E4;
  --bar: #F9F9FB;
  --scrim: rgba(0, 0, 0, .4);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --tabh: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fg: #F4F4F6; --fg2: #9C9CA3; --sep: #38383B;
    --accent: #4A9BFF; --on-accent: #001A3A; --good: #43C467; --good-bg: #12301B; --bad: #FF6259; --bad-bg: #3A1513; --bar: #121214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fg: #F4F4F6; --fg2: #9C9CA3; --sep: #38383B;
  --accent: #4A9BFF; --on-accent: #001A3A; --good: #43C467; --good-bg: #12301B; --bad: #FF6259; --bad-bg: #3A1513; --bar: #121214;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: calc(17px * var(--ts, 1)); line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

#app { position: relative; min-height: 100%; overflow-x: clip; }
.screen {
  min-height: 100vh; padding-bottom: calc(var(--tabh) + 40px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
}
.screen.anim-push { animation: push .32s cubic-bezier(.2,.8,.2,1); }
.screen.anim-pop { animation: pop .28s cubic-bezier(.2,.8,.2,1); }
.screen.anim-fade { animation: fade .2s ease-out; }
@keyframes push { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateX(-25%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
html[data-motion="reduce"] .screen.anim-push, html[data-motion="reduce"] .screen.anim-pop, html[data-motion="reduce"] .screen.anim-fade, html[data-motion="reduce"] .flip-inner { animation: none !important; transition: none !important; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Navigation bar */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar);
  border-bottom: 1px solid var(--sep);
}
.nav .wrap { display: flex; align-items: center; min-height: 48px; gap: 8px; }
.nav .back {
  background: none; border: 0; color: var(--accent); padding: 8px 4px; display: flex; align-items: center; gap: 2px;
  font-size: calc(17px * var(--ts, 1)); min-width: 0; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav .back svg { flex: none; }
.nav .ntitle { flex: 1; text-align: center; font-weight: 600; font-size: calc(17px * var(--ts, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav .spacer { width: 60px; flex: none; }

.head { padding-top: 22px; padding-bottom: 6px; }
.eyebrow { font-size: calc(13px * var(--ts, 1)); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg2); }
.large { font-size: calc(34px * var(--ts, 1)); line-height: 1.12; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--fg2); margin: 6px 0 0; font-size: calc(16px * var(--ts, 1)); max-width: 62ch; }

/* Grouped lists */
.group-label { font-size: calc(13px * var(--ts, 1)); text-transform: uppercase; letter-spacing: .04em; color: var(--fg2); margin: 26px 16px 7px; }
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.group + .note { margin: 7px 16px 0; font-size: calc(13px * var(--ts, 1)); color: var(--fg2); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; background: none; border: 0;
  text-align: left; min-height: 48px; position: relative; text-decoration: none; color: var(--fg);
}
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: 1px solid var(--sep); }
.row.has-tile + .row.has-tile::before { left: 62px; }
button.row:active, a.row:active { background: var(--fill); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-size: calc(17px * var(--ts, 1)); overflow-wrap: anywhere; }
.row .d { font-size: calc(14px * var(--ts, 1)); color: var(--fg2); margin-top: 1px; }
.row .v { color: var(--fg2); font-size: calc(15px * var(--ts, 1)); font-variant-numeric: tabular-nums; flex: none; }
.row .chev { color: var(--fg2); flex: none; opacity: .6; }
.row.destructive .t { color: var(--bad); }
.row.action .t { color: var(--accent); }
.tile {
  width: 34px; height: 34px; border-radius: 8px; flex: none; display: grid; place-items: center;
  color: #FFFFFF; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
}
.mini-bar { height: 4px; background: var(--fill); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

/* Summary card */
.summary { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 16px; display: grid; gap: 12px; }
.summary .big { font-size: calc(40px * var(--ts, 1)); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.summary .row2 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar { height: 8px; background: var(--fill); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--fill); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: calc(22px * var(--ts, 1)); font-variant-numeric: tabular-nums; }
.stat span { font-size: calc(13px * var(--ts, 1)); color: var(--fg2); }

/* Segmented control */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-top: 18px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 7px; font-size: calc(15px * var(--ts, 1)); font-weight: 500; color: var(--fg); min-width: 0; }
.seg button[aria-selected="true"] { background: var(--card); font-weight: 600; box-shadow: 0 0 0 1px var(--sep); }

/* Learn content */
.section { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 14px; }
.section h3 { margin: 0 0 6px; font-size: calc(13px * var(--ts, 1)); text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.section h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--sec, var(--accent)); flex: none; }
.section p { margin: 0; max-width: 65ch; }
.section ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 65ch; }
.section.lead p { font-size: calc(19px * var(--ts, 1)); line-height: 1.45; }
.memory { font-weight: 600; }
.table-wrap { overflow-x: auto; margin: 4px -4px 0; }
table { border-collapse: collapse; width: 100%; font-size: calc(15px * var(--ts, 1)); }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--sep); vertical-align: top; }
th { font-size: calc(13px * var(--ts, 1)); color: var(--fg2); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
tr:last-child td { border-bottom: 0; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: var(--r);
  padding: 14px 16px; font-size: calc(17px * var(--ts, 1)); font-weight: 600; background: var(--accent); color: var(--on-accent); min-height: 50px;
}
.btn.secondary { background: var(--card); color: var(--accent); }
.btn.plain { background: var(--fill); color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.btns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Flashcards */
.flip { margin-top: 18px; perspective: 1200px; cursor: pointer; }
.flip-inner { position: relative; min-height: 260px; transition: transform .45s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; display: grid; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border-radius: 16px;
  padding: 28px 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 260px; border: 2px solid transparent;
}
.face.back { transform: rotateY(180deg); border-color: var(--sec, var(--accent)); }
.face .lbl { font-size: calc(13px * var(--ts, 1)); text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); }
.face .txt { font-size: calc(24px * var(--ts, 1)); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.face.back .txt { font-weight: 500; font-size: calc(22px * var(--ts, 1)); }
.counter { text-align: center; color: var(--fg2); margin-top: 12px; font-variant-numeric: tabular-nums; font-size: calc(15px * var(--ts, 1)); }

/* Quiz */
.qprog { display: flex; align-items: center; gap: 10px; padding-top: 14px; }
.qprog .bar { flex: 1; height: 6px; }
.qprog span { font-size: calc(14px * var(--ts, 1)); color: var(--fg2); font-variant-numeric: tabular-nums; flex: none; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.chip { font-size: calc(12px * var(--ts, 1)); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 6px; background: var(--fill); color: var(--fg2); }
.chip.retry { background: var(--bad-bg); color: var(--bad); }
.qtext { font-size: calc(22px * var(--ts, 1)); line-height: 1.35; font-weight: 600; margin: 10px 0 0; max-width: 65ch; overflow-wrap: anywhere; }
.hint { font-size: calc(14px * var(--ts, 1)); color: var(--fg2); margin-top: 6px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 2px solid transparent;
  border-radius: var(--r); padding: 13px 14px; font-size: calc(17px * var(--ts, 1)); min-height: 52px;
}
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--fill); display: grid; place-items: center; font-size: calc(14px * var(--ts, 1)); font-weight: 700; color: var(--fg2); }
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
.opt.sel { border-color: var(--accent); }
.opt.sel .k { background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k { background: var(--good); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: var(--card); }
.opt:disabled { cursor: default; color: var(--fg); }

.mrow { background: var(--card); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; border: 2px solid transparent; }
.mrow .ml { font-weight: 600; overflow-wrap: anywhere; }
.mrow select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--sep); background: var(--bg); min-width: 0; }
.mrow.right { border-color: var(--good); }
.mrow.wrong { border-color: var(--bad); }
.mrow .fix { font-size: calc(14px * var(--ts, 1)); color: var(--good); font-weight: 600; }

.orow { background: var(--card); border-radius: var(--r); padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; }
.orow .n { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--fill); display: grid; place-items: center; font-size: calc(14px * var(--ts, 1)); font-weight: 700; color: var(--fg2); font-variant-numeric: tabular-nums; }
.orow .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.orow .mv { display: flex; gap: 4px; flex: none; }
.orow .mv button { width: 40px; height: 40px; border: 0; border-radius: 9px; background: var(--fill); color: var(--fg); display: grid; place-items: center; }
.orow .mv button:disabled { opacity: .3; cursor: default; }
.orow.right { border-color: var(--good); }
.orow.wrong { border-color: var(--bad); }

.calc { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: var(--r); padding: 10px 14px; margin-top: 18px; }
.calc input { flex: 1; min-width: 0; border: 0; background: none; font-size: calc(24px * var(--ts, 1)); font-weight: 600; font-variant-numeric: tabular-nums; padding: 6px 0; outline: none; }
.calc .unit { color: var(--fg2); flex: none; }
.calc.right { box-shadow: inset 0 0 0 2px var(--good); }
.calc.wrong { box-shadow: inset 0 0 0 2px var(--bad); }

.feedback { margin-top: 18px; border-radius: var(--r); padding: 16px; background: var(--card); border-left: 5px solid var(--fg2); }
.feedback.good { border-left-color: var(--good); }
.feedback.bad { border-left-color: var(--bad); }
.feedback .verdict { font-weight: 700; font-size: calc(19px * var(--ts, 1)); }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.feedback .ans { margin-top: 6px; font-weight: 600; }
.feedback p { margin: 8px 0 0; max-width: 65ch; }
.feedback ol { margin: 8px 0 0; padding-left: 22px; }
.kbd { font-size: calc(13px * var(--ts, 1)); color: var(--fg2); text-align: center; margin-top: 10px; }

.result-num { font-size: calc(64px * var(--ts, 1)); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 18px; }
.missed { margin-top: 10px; }

/* Settings */
textarea { width: 100%; min-height: 180px; border: 0; border-radius: var(--r); background: var(--card); padding: 12px 14px; font-family: var(--mono); font-size: calc(13px * var(--ts, 1)); line-height: 1.45; resize: vertical; display: block; }
.errors { margin-top: 12px; background: var(--bad-bg); color: var(--bad); border-radius: var(--r); padding: 12px 16px; font-size: calc(14px * var(--ts, 1)); }
.errors ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.errors li { overflow-wrap: anywhere; }
.confirm { display: grid; gap: 10px; padding: 12px 16px 16px; }
.confirm p { margin: 0; font-size: calc(15px * var(--ts, 1)); color: var(--fg2); }
.empty { text-align: center; color: var(--fg2); padding: 30px 16px; background: var(--card); border-radius: var(--r); margin-top: 16px; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bar); border-top: 1px solid var(--sep);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--tabh); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg2); font-size: 11px; font-weight: 500; min-width: 0; }
.tabbar button[aria-selected="true"] { color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabh) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: calc(15px * var(--ts, 1)); z-index: 40; max-width: calc(100% - 32px);
  text-align: center;
}

@media (min-width: 900px) {
  .large { font-size: calc(40px * var(--ts, 1)); }
  .qtext { font-size: calc(26px * var(--ts, 1)); }
  .opt { font-size: calc(19px * var(--ts, 1)); }
}

/* Full screen prompt */
.fs-scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; animation: fade .2s ease-out; }
.fs-card { background: var(--card); border-radius: 16px; padding: 22px 20px 20px; width: 100%; max-width: 380px; display: grid; gap: 14px; }
.fs-card h2 { margin: 0; font-size: calc(22px * var(--ts, 1)); }
.fs-card p { margin: 0; color: var(--fg2); font-size: calc(16px * var(--ts, 1)); }
html[data-motion="reduce"] .fs-scrim { animation: none; }

/* =====================================================================
   SOLID COLOUR SYSTEM
   --s-* are solid fills that keep white text readable in both themes.
   --c-* are the same hues tuned for text and icons on the current theme.
   ===================================================================== */
:root {
  --s-learn: #0A62CC; --s-practice: #C2410C; --s-progress: #1D7F38; --s-settings: #55555F;
  --c-learn: #0A62CC; --c-practice: #C2410C; --c-progress: #1D7F38; --c-settings: #55555F;
  --spring: cubic-bezier(.2, .9, .25, 1.12);
  --soft: cubic-bezier(.2, .8, .2, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    /* real spring curves (stiffness 380 / damping 24, and a softer 300 / 30) */
    --spring: linear(0, 0.0273, 0.098, 0.1972, 0.3122, 0.4328, 0.5514, 0.6624, 0.7619, 0.8477, 0.9191, 0.976, 1.0192, 1.0502, 1.0704, 1.0817, 1.0858, 1.0844, 1.079, 1.0708, 1.0611, 1.0508, 1.0405, 1.0308, 1.0221, 1.0145, 1.0081, 1.0029, 0.999, 0.9961, 0.9942, 0.9931, 0.9926, 0.9927, 0.9931, 0.9938, 0.9946, 0.9955, 0.9963, 0.9972, 1);
    --soft: linear(0, 0.0263, 0.0913, 0.1784, 0.2756, 0.3746, 0.47, 0.5583, 0.6376, 0.7072, 0.767, 0.8175, 0.8594, 0.8937, 0.9213, 0.9431, 0.9602, 0.9733, 0.9832, 0.9904, 0.9957, 0.9993, 1.0017, 1.0031, 1.004, 1.0043, 1.0043, 1.0041, 1.0038, 1.0034, 1.0029, 1.0025, 1);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --c-learn: #4A9BFF; --c-practice: #FF8A4C; --c-progress: #43C467; --c-settings: #A1A1AA; }
}
:root[data-theme="dark"] { --c-learn: #4A9BFF; --c-practice: #FF8A4C; --c-progress: #43C467; --c-settings: #A1A1AA; }

.tabbar #tab-learn[aria-selected="true"] { color: var(--c-learn); }
.tabbar #tab-practice[aria-selected="true"] { color: var(--c-practice); }
.tabbar #tab-progress[aria-selected="true"] { color: var(--c-progress); }
.tabbar #tab-settings[aria-selected="true"] { color: var(--c-settings); }
.tabbar .in { position: relative; }
.tabbar .in > button { position: relative; z-index: 1; -webkit-tap-highlight-color: transparent; }
.tabbar .in, .tabbar .in > button { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; }
.tabbar .in > button:focus:not(:focus-visible) { outline: none; }
.tabbar .in > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 999px; }
.tabbar .in > button > span:first-child { display: inline-flex; }

.summary.hero { background: var(--hero, var(--s-learn)); color: #FFFFFF; }
.hero .eyebrow { color: rgba(255, 255, 255, .82); }
.hero .sub { color: rgba(255, 255, 255, .88); }
.hero .bar { background: rgba(255, 255, 255, .26); }
.hero .bar i { background: #FFFFFF !important; }
.hero .stat { background: rgba(255, 255, 255, .16); }
.hero .stat span { color: rgba(255, 255, 255, .85); }
.hero .big { font-size: calc(48px * var(--ts, 1)); letter-spacing: -.02em; }
.summary.hero.result .big { font-size: calc(64px * var(--ts, 1)); }

.tile svg { width: 20px; height: 20px; display: block; }
.switch {
  width: 51px; height: 31px; border-radius: 999px; background: var(--fill); position: relative; flex: none;
  border: 0; padding: 0; transition: background-color .2s ease; display: inline-block; vertical-align: middle;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .04);
  transition: translate .5s var(--spring), scale .2s ease;
}
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { translate: 20px 0; }
.switch:active::after { scale: 1.18 1; }
.switch:disabled { opacity: .45; }
.tb-lens, .seg-thumb, .pocket, .mini-head { display: none; }
.toast[hidden] { display: none; }

/* =====================================================================
   LIQUID GLASS
   html[data-glass] = full | low | off (off = Reduce Transparency).
   One material, presets per surface (the Notes app's approach):
   each preset sets --gl-bg, --gl-blur and --gl-sat; JS adds edge
   refraction on top in the Full tier.
   --lx / --ly = where the light comes from (default -15 degrees, the
   angle the Notes lens uses), nudged by device tilt.
   ===================================================================== */
:root {
  --glass-tint: rgba(252, 252, 254, .56);
  --glass-strong: rgba(246, 246, 249, .80);
  --glass-solid: #F9F9FB;
  --rim-a: rgba(255, 255, 255, .95);
  --rim-b: rgba(255, 255, 255, .55);
  --rim-c: rgba(0, 0, 0, .07);
  --glass-shadow: 0 8px 28px rgba(0, 0, 0, .12), 0 1px 3px rgba(0, 0, 0, .07);
  --lens-rest: rgba(0, 0, 0, .06);
  --lens-lift: rgba(255, 255, 255, .06);
  --press: rgba(10, 98, 204, .12);
  --thumb: #FFFFFF;
  --lx: .39px; --ly: 1.45px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass-tint: rgba(36, 36, 40, .48); --glass-strong: rgba(24, 24, 28, .78); --glass-solid: #1C1C1E;
    --rim-a: rgba(255, 255, 255, .42); --rim-b: rgba(255, 255, 255, .16); --rim-c: rgba(255, 255, 255, .08);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    --lens-rest: rgba(255, 255, 255, .11); --lens-lift: rgba(255, 255, 255, .03); --press: rgba(74, 155, 255, .16); --thumb: #636366;
  }
}
:root[data-theme="dark"] {
  --glass-tint: rgba(36, 36, 40, .48); --glass-strong: rgba(24, 24, 28, .78); --glass-solid: #1C1C1E;
  --rim-a: rgba(255, 255, 255, .42); --rim-b: rgba(255, 255, 255, .16); --rim-c: rgba(255, 255, 255, .08);
  --glass-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  --lens-rest: rgba(255, 255, 255, .11); --lens-lift: rgba(255, 255, 255, .03); --press: rgba(74, 155, 255, .16); --thumb: #636366;
}

/* presets */
.g { --gl-bg: var(--glass-tint); --gl-blur: 12px; --gl-sat: 185%; }
.g[data-preset="navigationBar"] { --gl-bg: var(--glass-strong); --gl-blur: 20px; }
.g[data-preset="menu"] { --gl-bg: var(--glass-strong); --gl-blur: 18px; }
.g[data-preset="alert"] { --gl-bg: var(--glass-strong); --gl-blur: 30px; --gl-sat: 170%; }
.g[data-preset="controls"] { --gl-blur: 6px; }

html[data-glass] .g {
  background: var(--gl-bg);
  -webkit-backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat)) brightness(1.04);
  backdrop-filter: blur(var(--gl-blur)) saturate(var(--gl-sat)) brightness(1.04);
  box-shadow:
    inset var(--lx) var(--ly) 1px -1px var(--rim-a),
    inset calc(var(--lx) * -1) calc(var(--ly) * -1) 1px -1px var(--rim-b),
    inset 0 0 0 .5px var(--rim-c),
    var(--glass-shadow);
}
html[data-glass="off"] .g { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-glass="off"] .g[data-preset="alert"] { background: var(--card); }

/* floating tab bar */
html[data-glass] { --tabh: 62px; }
html[data-glass] .screen { padding-bottom: calc(var(--tabh) + 64px + env(safe-area-inset-bottom, 0px)); }
html[data-glass] .tabbar {
  background: none; border: 0; pointer-events: none;
  padding: 0 max(14px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(14px, env(safe-area-inset-right, 0px));
  transition: transform .45s var(--spring);
}
html[data-glass] .tabbar .in {
  max-width: 440px; border-radius: 999px; padding: 4px; touch-action: none; pointer-events: auto;
  transition: height .45s var(--spring);
}
html[data-glass] .tabbar .in > button { border-radius: 999px; font-size: 10.5px; font-weight: 600; gap: 1px; }
html[data-glass] .tabbar .in svg { width: 24px; height: 24px; transition: width .35s var(--spring), height .35s var(--spring); }
html[data-glass] .tabbar .in > button > span:last-child { transition: opacity .2s ease, max-height .35s var(--spring), font-size .35s var(--spring); max-height: 16px; }
html[data-glass].tb-min .tabbar .in { height: 48px; }
html[data-glass].tb-min .tabbar .in > button > span:last-child { opacity: 0; max-height: 0; font-size: 0; }
html[data-glass].tb-min .tabbar .in svg { width: 22px; height: 22px; }
html.kb-open .tabbar { transform: translateY(calc(100% + 24px)); }
html[data-glass] .tb-lens {
  display: block; position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; z-index: 2; pointer-events: none;
  border-radius: 999px; background: var(--lens-rest);
  transition: transform .5s var(--spring), width .5s var(--spring), scale .45s var(--spring), background-color .2s ease, box-shadow .2s ease;
}
html[data-glass] .tb-lens.drag { transition: width .5s var(--spring), scale .45s var(--spring), background-color .2s ease, box-shadow .2s ease; }
html[data-glass] .tb-lens.lift, html[data-glass] .tb-lens.moving {
  background: var(--lens-lift);
  box-shadow: inset var(--lx) var(--ly) 1px -1px var(--rim-a), inset calc(var(--lx) * -1) calc(var(--ly) * -1) 1px -1px var(--rim-a), inset 0 0 0 .5px var(--rim-c), 0 4px 14px rgba(0, 0, 0, .08);
}
html[data-glass] .tb-lens.lift { scale: 1.16 1.22; }
html[data-glass] .tb-lens.no-anim, html[data-glass] .seg-thumb.no-anim { transition: none; }

/* bars, dialog, toast */
html[data-glass]:not([data-glass="off"]) .nav, html[data-glass]:not([data-glass="off"]) body::before {
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(20px) saturate(185%); backdrop-filter: blur(20px) saturate(185%);
}
html[data-glass]:not([data-glass="off"]) .nav { border-bottom-color: transparent; box-shadow: 0 .5px 0 var(--sep); }
html[data-glass] .fs-card { border-radius: 22px; }
html[data-glass]:not([data-glass="off"]) .fs-scrim { background: rgba(0, 0, 0, .28); }
html[data-glass] .toast { color: var(--fg); border-radius: 999px; padding: 11px 20px; z-index: 40; width: max-content; }

/* segmented control thumb */
html[data-glass] .seg.has-thumb { position: relative; }
html[data-glass] .seg.has-thumb button { position: relative; z-index: 1; }
html[data-glass] .seg.has-thumb button[aria-selected="true"] { background: none; box-shadow: none; }
html[data-glass] .seg-thumb {
  display: block; position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; z-index: 0; pointer-events: none;
  border-radius: 7px; background: var(--thumb);
  box-shadow: inset var(--lx) var(--ly) 1px -1px var(--rim-a), inset calc(var(--lx) * -1) calc(var(--ly) * -1) 1px -1px var(--rim-b), inset 0 0 0 .5px var(--rim-c), 0 1px 4px rgba(0, 0, 0, .12);
  transition: transform .5s var(--spring), width .5s var(--spring), scale .45s var(--spring), background-color .2s ease;
}
html[data-glass] .seg-thumb.moving { background: var(--glass-tint); scale: 1.08 1.14; }

/* glass edges on colour cards, tiles, solid buttons */
html[data-glass] .tile, html[data-glass] .hero, html[data-glass] .btn:not(.secondary):not(.plain) {
  box-shadow: inset var(--lx) var(--ly) 1px -1px rgba(255, 255, 255, .6), inset calc(var(--lx) * -1) calc(var(--ly) * -1) 1px -1px rgba(255, 255, 255, .3), inset 0 0 0 .5px rgba(255, 255, 255, .16);
}

/* press: light under the finger + squeeze */
html[data-glass] .btn, html[data-glass] .opt { transition: scale .5s var(--spring), border-color .2s ease, background-color .25s ease; }
html[data-glass] .pressing { background-image: radial-gradient(140px circle at var(--px, 50%) var(--py, 50%), var(--press), transparent 70%); }
html[data-glass] .btn.pressing:not(.secondary):not(.plain) { background-image: radial-gradient(160px circle at var(--px, 50%) var(--py, 50%), rgba(255, 255, 255, .32), transparent 70%); }
html[data-glass] .btn.pressing, html[data-glass] .opt.pressing { scale: .965; }

/* progressive blur where content slides under the tab bar (Full only) */
html[data-glass="full"] .pocket {
  display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 24; pointer-events: none;
  height: calc(var(--tabh) + 44px + env(safe-area-inset-bottom, 0px));
}
.pocket > i { position: absolute; inset: 0; }
.pocket > i:nth-child(1) { -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px); -webkit-mask-image: linear-gradient(transparent, #000 40%); mask-image: linear-gradient(transparent, #000 40%); }
.pocket > i:nth-child(2) { -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); -webkit-mask-image: linear-gradient(transparent 30%, #000 70%); mask-image: linear-gradient(transparent 30%, #000 70%); }
.pocket > i:nth-child(3) { -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); -webkit-mask-image: linear-gradient(transparent 60%, #000); mask-image: linear-gradient(transparent 60%, #000); }

/* app hidden: stop all motion (the Notes app pauses glass when backgrounded) */
html.paused *, html.paused *::before, html.paused *::after { animation-play-state: paused !important; }

/* =====================================================================
   MOTION
   ===================================================================== */
.screen.anim-push { animation: push .46s var(--soft); }
.screen.anim-pop { animation: pop .42s var(--soft); }
.screen.anim-tabr { animation: tabr .42s var(--soft); }
.screen.anim-tabl { animation: tabl .42s var(--soft); }
@keyframes push { from { transform: translateX(42%); opacity: .2; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateX(-26%); opacity: .3; filter: brightness(.85); } to { transform: none; opacity: 1; filter: none; } }
@keyframes tabr { from { transform: translateX(44px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes tabl { from { transform: translateX(-44px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }

.mini-head {
  position: fixed; left: 0; right: 0; top: 0; z-index: 19; pointer-events: none; opacity: 0;
  padding-top: env(safe-area-inset-top, 0px); background: var(--bar); border-bottom: 1px solid var(--sep);
  transform: translateY(-6px); transition: opacity .22s ease, transform .4s var(--spring); display: block;
}
.mini-head .wrap { min-height: 46px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: calc(17px * var(--ts, 1)); }
.mini-head.on { opacity: 1; transform: none; }
html[data-glass]:not([data-glass="off"]) .mini-head { background: var(--glass-strong); -webkit-backdrop-filter: blur(20px) saturate(185%); backdrop-filter: blur(20px) saturate(185%); border-bottom-color: transparent; }
.nav .ntitle { transition: opacity .22s ease, transform .4s var(--spring); }
.nav.title-hidden .ntitle { opacity: 0; transform: translateY(6px); }

.opt, .mrow, .orow, .calc { transition: border-color .2s ease, background-color .25s ease, scale .5s var(--spring); }
.opt.sel { animation: pop-in .45s var(--spring); }
.opt.right, .mrow.right, .orow.right, .calc.right { animation: bounce .6s var(--spring); }
.opt.wrong, .mrow.wrong, .orow.wrong, .calc.wrong { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
.feedback { animation: rise .55s var(--spring) both; }
.feedback ~ .btns { animation: rise .6s var(--spring) .06s both; }
.feedback .verdict { display: inline-block; }
.feedback.good .verdict { animation: bounce .7s var(--spring) .1s; }
@keyframes pop-in { 0% { scale: 1; } 40% { scale: .97; } 100% { scale: 1; } }
@keyframes bounce { 0% { scale: 1; } 30% { scale: 1.035; } 100% { scale: 1; } }
@keyframes shake { 10%, 90% { translate: -2px 0; } 20%, 80% { translate: 4px 0; } 30%, 50%, 70% { translate: -7px 0; } 40%, 60% { translate: 7px 0; } }
@keyframes rise { from { opacity: 0; translate: 0 14px; scale: .98; } }

.flip-inner { transition: transform .7s var(--spring), scale .4s var(--spring); }
.flip:active .flip-inner { scale: .985; }
.row .tile { transition: scale .5s var(--spring); }
button.row:active .tile, a.row:active .tile { scale: .9; }
button.row, a.row { transition: background-color .25s ease; }
.row .chev { transition: translate .4s var(--spring); }
button.row:active .chev { translate: 3px 0; }
.bar i, .mini-bar i { transition: width .9s var(--soft); }

/* Reduced motion is decided by the app (Settings > Motion: System, On, Off),
   which sets html[data-motion="reduce"]. "System" follows the phone. */
html[data-motion="reduce"] .screen.anim-push, html[data-motion="reduce"] .screen.anim-pop, html[data-motion="reduce"] .screen.anim-tabr, html[data-motion="reduce"] .screen.anim-tabl,
html[data-motion="reduce"] .opt, html[data-motion="reduce"] .mrow, html[data-motion="reduce"] .orow, html[data-motion="reduce"] .calc, html[data-motion="reduce"] .feedback, html[data-motion="reduce"] .feedback ~ .btns, html[data-motion="reduce"] .feedback .verdict { animation: none !important; }
html[data-motion="reduce"] .bar i, html[data-motion="reduce"] .mini-bar i, html[data-motion="reduce"] .mini-head, html[data-motion="reduce"] .nav .ntitle, html[data-motion="reduce"] .row .tile, html[data-motion="reduce"] .row .chev, html[data-motion="reduce"] .flip-inner, html[data-motion="reduce"] .switch::after,
html[data-motion="reduce"] .tb-lens, html[data-motion="reduce"] .seg-thumb, html[data-motion="reduce"] .btn, html[data-motion="reduce"] .opt, html[data-motion="reduce"] .tabbar, html[data-motion="reduce"] .tabbar .in { transition: none !important; }

/* =====================================================================
   BACKGROUND PHOTO + COLOUR THEMES (v3.3)
   --acc-* are set from Settings > Colour theme. Unset = original blue.
   ===================================================================== */
:root { --accent: var(--acc-l, #0A62CC); --s-learn: var(--acc-s, #0A62CC); --c-learn: var(--acc-l, #0A62CC); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --accent: var(--acc-d, #4A9BFF); --on-accent: var(--acc-on-d, #001A3A); --c-learn: var(--acc-d, #4A9BFF); }
}
:root[data-theme="dark"] { --accent: var(--acc-d, #4A9BFF); --on-accent: var(--acc-on-d, #001A3A); --c-learn: var(--acc-d, #4A9BFF); }
@supports (color: color-mix(in srgb, red, blue)) {
  :root { --press: color-mix(in srgb, var(--accent) 14%, transparent); }
  html:root[data-tint] {
    --bg: color-mix(in srgb, var(--accent) 9%, #F2F2F6); --bar: color-mix(in srgb, var(--accent) 6%, #F9F9FB);
    --fill: color-mix(in srgb, var(--accent) 12%, #E8E8ED); --glass-solid: color-mix(in srgb, var(--accent) 6%, #F9F9FB);
  }
  @media (prefers-color-scheme: dark) {
    html:root[data-tint]:not([data-theme="light"]) {
      --bg: color-mix(in srgb, var(--accent) 9%, #000000); --bar: color-mix(in srgb, var(--accent) 8%, #121214);
      --fill: color-mix(in srgb, var(--accent) 14%, #2C2C2E); --card: color-mix(in srgb, var(--accent) 5%, #1C1C1E);
      --glass-solid: color-mix(in srgb, var(--accent) 6%, #1C1C1E);
    }
  }
  html:root[data-tint][data-theme="dark"] {
    --bg: color-mix(in srgb, var(--accent) 9%, #000000); --bar: color-mix(in srgb, var(--accent) 8%, #121214);
    --fill: color-mix(in srgb, var(--accent) 14%, #2C2C2E); --card: color-mix(in srgb, var(--accent) 5%, #1C1C1E);
    --glass-solid: color-mix(in srgb, var(--accent) 6%, #1C1C1E);
  }
}

/* Photo layer: sits behind everything, always covers the screen at its own aspect ratio */
.bg-photo {
  position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100lvh; z-index: -1; pointer-events: none; display: none;
  background-position: center; background-repeat: no-repeat; background-size: cover;
  opacity: var(--photo-op, .3); filter: blur(var(--photo-blur, 0px)); transform: scale(var(--photo-scale, 1));
  transition: opacity .35s ease;
  will-change: transform; contain: strict; backface-visibility: hidden;
}
.bg-photo[data-fit="contain"] { background-size: contain; }
html[data-photo] .bg-photo { display: block; }
html[data-photo] .screen { background: transparent; }
html[data-photo] .head, html[data-photo] .group-label, html[data-photo] main > .note, html[data-photo] main > .sub, html[data-photo] .counter, html[data-photo] .kbd, html[data-photo] .hint {
  text-shadow: 0 0 10px var(--bg), 0 0 3px var(--bg);
}
.tile.bg-thumb { background-size: cover; background-position: center; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15); }

/* Settings controls */
.slider-row { padding: 12px 16px 14px; position: relative; }
.slider-row + .slider-row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: 1px solid var(--sep); }
.slider-row .sl-head { display: flex; justify-content: space-between; gap: 12px; font-size: calc(17px * var(--ts, 1)); margin-bottom: 8px; }
.slider-row .sl-head .v { color: var(--fg2); font-size: calc(15px * var(--ts, 1)); font-variant-numeric: tabular-nums; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 28px; }
.swatches {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px;
  background: var(--card); border-radius: var(--r); padding: 12px 8px;
}
.sw {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none;
  padding: 6px 2px; border-radius: 10px; font-size: calc(12px * var(--ts, 1)); color: var(--fg2); min-width: 0; cursor: pointer;
}
.sw .dot { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .18); transition: scale .45s var(--spring), box-shadow .2s ease; }
.sw .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sw.on { color: var(--fg); font-weight: 600; }
.sw.on .dot { box-shadow: 0 0 0 2px var(--card), 0 0 0 4.5px var(--accent); }
.sw:active .dot { scale: .9; }
.sw input[type=color] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.sw .dot.custom { background: conic-gradient(#F43F5E, #F59E0B, #84CC16, #06B6D4, #6366F1, #D946EF, #F43F5E); }
html[data-motion="reduce"] .sw .dot, html[data-motion="reduce"] .bg-photo { transition: none !important; }

/* =====================================================================
   COURSE LIBRARY (v3.4)
   ===================================================================== */
.lib-item { display: flex; align-items: center; position: relative; }
.lib-item + .lib-item::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; border-top: 1px solid var(--sep); }
.lib-item > .row { flex: 1; min-width: 0; }
.lib-item .v.on { color: var(--good); font-weight: 600; }
.lib-del {
  flex: none; width: 44px; height: 44px; margin-right: 6px; border: 0; border-radius: 10px; background: none;
  color: var(--bad); display: grid; place-items: center;
}
.lib-del:active { background: var(--bad-bg); }
.lib-del svg { width: 20px; height: 20px; }
.howto { background: var(--card); border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px; }
.howto h3 { margin: 0 0 8px; font-size: calc(15px * var(--ts, 1)); font-weight: 600; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: calc(15px * var(--ts, 1)); color: var(--fg); max-width: 65ch; }
.ts-scale { display: flex; align-items: center; gap: 12px; }
.ts-scale input[type=range] { flex: 1; min-width: 0; }
.ts-a { flex: none; color: var(--fg2); font-weight: 600; line-height: 1; }
.ts-a.small { font-size: 13px; }
.ts-a.big { font-size: 22px; }
.ts-reset { border: 0; background: var(--fill); color: var(--accent); font-size: 14px; font-weight: 600; padding: 5px 11px; border-radius: 999px; }
.howto p { margin: 10px 0 0; font-size: calc(13px * var(--ts, 1)); color: var(--fg2); max-width: 65ch; }
</style>

<body>
<div id="app"></div>
<noscript><p style="padding:24px">This study app needs JavaScript turned on.</p></noscript>
<script id="course-data">
/* =====================================================================
   COURSE DATA  —  edit or replace this block only.
   The app reads nothing else. Every module is one COURSE.modules.push().
   Helpers below build each question type:
     mc(question, [options], answerIndex | [indexes], explanation)
     tf(statement, true|false, explanation)
     match(question, [[left, right], ...], explanation)
     order(question, [steps in the correct order], explanation)
     calc(question, numberAnswer, explanation, {unit, tolerance})
     card(front, back)
   ===================================================================== */
const mc = (q, options, answer, explain) => ({ type: "mc", q, options, answer, explain });
const tf = (q, answer, explain) => ({ type: "tf", q, answer, explain });
const match = (q, pairs, explain) => ({ type: "match", q, pairs, explain });

  }
  function liveBlur(px) {

    try { const x = document.createElement("canvas").getContext("2d"); x.filter = "blur(2px)"; return x.filter === "blur(2px)"; } catch (e) { return false; }
  })();
  function bakeBlur() {
    const want = bgOpts.blur || 0, seq = ++bakeSeq;
    if (!photoBlob) return;
    if (!want) { setShown(bgPhoto); bakedBlur = 0; liveBlur(0); return; }
    if (!canvasBlurOk) return; /* keep the CSS blur on browsers without canvas filters */

      if (seq !== bakeSeq) { src.done(); return; }

      const w = Math.max(1, Math.round(src.w * k)), hh = Math.max(1, Math.round(src.h * k));

  /* Opens almost any picture into something a canvas can draw */
  function decodeImage(blob) {
    const viaImg = () => new Promise((res, rej) => {
      const u = URL.createObjectURL(blob), img = new Image();

      img.src = u;

    const viaData = () => blobToDataUrl(blob).then(u => new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, hh = img.naturalHeight;

      return createImageBitmap(blob, { imageOrientation: "from-image" })
        .catch(() => createImageBitmap(blob))
        .then(bm => ({ img: bm, w: bm.width, h: bm.height, done: () => { try { bm.close(); } catch (e) {} } }))
        .catch(viaImgThenData);
    }
    return viaImgThenData();
  }
  /* HEIC and HEIF start with an "ftyp" box naming the brand */
  function sniffHeic(f) {
    return f.slice(0, 16).arrayBuffer().then(buf => {
      const s = String.fromCharCode.apply(null, new Uint8Array(buf));
      return s.slice(4, 8) === "ftyp" && /^(heic|heix|hevc|hevx|heim|heis|mif1|msf1)/.test(s.slice(8, 12));
    }).catch(() => false);
  }
  let heicLoader = null;
  function loadHeicConverter() {
    if (window.heic2any) return Promise.resolve(window.heic2any);
    if (heicLoader) return heicLoader;
    heicLoader = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
      s.async = true;
      s.onload = () => window.heic2any ? res(window.heic2any) : rej(new Error("missing"));

  function heicToJpeg(f) {
    return loadHeicConverter().then(conv => conv({ blob: f, toType: "image/jpeg", quality: 0.9 }))
      .then(out => Array.isArray(out) ? out[0] : out);

  /* TIFF opens natively only in Safari. Elsewhere a small decoder loads once, only when a TIFF is picked. */

  }
  let tiffLoader = null;

    if (!tiffLoader) tiffLoader = new Promise((res, rej) => {

      s.src = "https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js";
      s.async = true;
      s.onload = () => window.UTIF ? res(window.UTIF) : rej(new Error("missing"));

    });
  }

  /* Shrinks to fit phone screens (longest side 1920 px). WebP where the
     browser can make it (about half the size of JPEG), JPEG otherwise. */
  function shrinkImage(blob) {
    return decodeImage(blob).then(src => new Promise((res, rej) => {
      try {
        const encode = (max, q, type) => new Promise(done => {
          const k = Math.min(1, max / Math.max(src.w, src.h)), w = Math.max(1, Math.round(src.w * k)), hh = Math.max(1, Math.round(src.h * k));
          const c = document.createElement("canvas"); c.width = w; c.height = hh;
          const x = c.getContext("2d"); x.fillStyle = "#FFFFFF"; x.fillRect(0, 0, w, hh);

        const go = (i, type) => encode(tries[i][0], tries[i][1], type).then(b => {
          if (!b) { if (type !== "image/jpeg") return go(i, "image/jpeg"); throw new Error("encode"); }
          if (type === "image/webp" && b.type !== "image/webp") return go(i, "image/jpeg");

          return b;
        });
        go(0, "image/webp").then(b => { src.done(); res(b); }, e => { src.done(); rej(e); });
      } catch (e) { src.done(); rej(e); }
    }));
  }
  function savePhoto(b) {
    return idb.set("bgPhoto", b).then(() => { store.del("aps.bgPhoto"); return true; })
      .catch(() => blobToDataUrl(b).then(u => store.trySet("aps.bgPhoto", u)).catch(() => false));
  }
  let photoBusy = false;
  function setPhotoFromFile(f) {
    if (photoBusy) return;
    const name = f.name || "", typeOk = !f.type || /^image\//i.test(f.type) || /octet-stream|heic|heif/i.test(f.type);
    if (!typeOk && !PHOTO_EXT.test(name)) { toast("That file is not a picture."); return; }
    photoBusy = true;
    toast("Preparing your photo…");
    const nameHeic = /\.(heic|heif|hif)$/i.test(name) || /hei[cf]/i.test(f.type || "");
    const nameTiff = /\.tiff?$/i.test(name) || /tiff/i.test(f.type || "");
    /* Read the file ONCE into memory and work on that copy. Some Android
       gallery links fail on a second read (NotReadableError). */
    const readAll = () => f.arrayBuffer ? f.arrayBuffer() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(f); });

      if (!buf || !buf.byteLength) throw new Error("The file was empty");

      shrinkImage(f).catch(err => {
        if (isHeic) {
          toast("Converting HEIC photo…");
          return heicToJpeg(f).then(shrinkImage, () => { throw new Error("heic"); });
        }
        if (isTiff) {
          toast("Converting TIFF photo…");
          return tiffToPng(f).then(shrinkImage, () => { throw new Error("tiff"); });
        }
        throw err;
      })
    ).then(b => {
      usePhotoBlob(b);
      applyPhoto(true); haptic("CONFIRM");
      return savePhoto(b);
    }).then(saved => {
      toast(saved ? "Background photo set" : "Photo set for now. This browser could not save it, so it will be gone next time.");
      if (tab === "settings" && stack.length === 1) refresh();

      const m = e && e.message;
      const why = e && e.name && e.name !== "Error" ? " (" + e.name + ")" : (m && m !== "decode" && m !== "encode" ? " (" + String(m).slice(0, 60) + ")" : "");

  }
  function removePhoto() {
    usePhotoBlob(null);
    store.del("aps.bgPhoto"); idb.del("bgPhoto").catch(() => {});

  }
  /* Start-up: read the photo without blocking. Older versions kept it in

  function loadPhoto() {
    const done = b => {
      if (!b || !(b instanceof Blob) || !b.size) return;
      usePhotoBlob(b); applyPhoto(true);
      if (tab === "settings" && stack.length === 1) refresh();
    };

    try { old = store.get("aps.bgPhoto"); } catch (e) {}

      let b = null;
      try { b = dataUrlToBlob(old); } catch (e) {}

    idb.get("bgPhoto").then(done).catch(() => {});
  }
  /* Finds the strongest colour in the photo: hues are bucketed and weighted

  function photoColour(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        try {
          const N = 48, c = document.createElement("canvas"); c.width = N; c.height = N;
          const x = c.getContext("2d"); x.drawImage(img, 0, 0, N, N);

    });
  }

  /* Settings section for the photo and the colour theme */
  function renderLook(body, segOf, switchRow) {
    body.appendChild(h("div", { class: "group-label", text: "Background photo" }));
    const fileIn = h("input", { type: "file", accept: PHOTO_ACCEPT, id: "bg-file", hidden: true });
    fileIn.addEventListener("change", () => { const f = fileIn.files && fileIn.files[0]; fileIn.value = ""; if (f) setPhotoFromFile(f); });

    if (bgPhoto) { thumb = h("div", { class: "tile bg-thumb", "aria-hidden": "true" }); thumb.style.backgroundImage = 'url("' + bgPhoto + '")'; }

      row({ cls: "action", tile: thumb, title: bgPhoto ? "Change photo" : "Choose a photo", desc: bgPhoto ? "Fits your screen automatically" : "JPG, PNG, HEIC, WebP and more. Shows faintly behind the app", noChev: true, onclick: () => fileIn.click() }),

        const out = h("span", { class: "v", text: fmt(val) });
        const inp = h("input", { type: "range", id: id, min: String(min), max: String(max), step: "1", value: String(val), "aria-label": label });
        inp.addEventListener("input", () => { const v = +inp.value; out.textContent = fmt(v); set(v); applyPhoto(); });

        return h("div", { class: "slider-row" }, h("div", { class: "sl-head" }, h("span", { text: label }), out), inp);
      };
      body.appendChild(h("div", { class: "group", style: "margin-top:12px" },
        slider("Visibility", "bg-op", 5, 85, bgOpts.op, v => v + "%", v => { bgOpts.op = v; }),
        slider("Blur", "bg-blur", 0, 20, bgOpts.blur, v => v ? v + " px" : "Off", v => { bgOpts.blur = v; })));
      body.appendChild(h("div", { class: "group-label", text: "Photo fit" }));
      body.appendChild(segOf("Fit", [["cover", "Fill screen"], ["contain", "Whole photo"]], bgOpts.fit === "contain" ? "contain" : "cover", id => {
        bgOpts.fit = id; store.set("aps.bg", bgOpts); applyPhoto();
      }));
      body.appendChild(h("p", { class: "note", style: "margin:7px 16px 0;font-size:calc(13px * var(--ts, 1));color:var(--fg2)", text: "Fill screen crops the edges so the photo covers any screen shape. Whole photo shows all of it with plain space around it." }));

    const sw = h("div", { class: "swatches", role: "radiogroup", "aria-label": "Colour theme" });
    const cur = (accent && accent.id) || "blue";
    ACCENTS.forEach(a => sw.appendChild(h("button", { class: "sw" + (cur === a.id ? " on" : ""), role: "radio", "aria-checked": String(cur === a.id), id: "accent-" + a.id, onclick: () => setAccent({ id: a.id }) },
      h("span", { class: "dot", style: "background:linear-gradient(135deg," + a.l + " 50%," + a.d + " 50%)" }), h("span", { class: "nm", text: a.name }))));
    const cv = cur === "custom" ? accentFrom(accent.hex) : null;
    const picker = h("input", { type: "color", id: "accent-custom", value: (cur === "custom" && accent.hex) || "#E879A9", "aria-label": "Pick your own colour" });
    const cdot = h("span", { class: "dot" + (cv ? "" : " custom"), style: cv ? "background:linear-gradient(135deg," + cv.l + " 50%," + cv.d + " 50%)" : null });
    picker.addEventListener("input", () => { setAccent({ id: "custom", hex: picker.value }, false); const v = accentFrom(picker.value); cdot.className = "dot"; cdot.style.background = "linear-gradient(135deg," + v.l + " 50%," + v.d + " 50%)"; });
    picker.addEventListener("change", () => setAccent({ id: "custom", hex: picker.value }));
    sw.appendChild(h("label", { class: "sw" + (cur === "custom" ? " on" : "") }, cdot, h("span", { class: "nm", text: "Custom" }), picker));

    body.appendChild(h("div", { class: "group", style: "margin-top:12px" },
      bgPhoto ? row({ cls: "action", tile: iconTile("#6D28D9", "palette"), title: "Match my photo", desc: "Uses the strongest colour in your photo", noChev: true,
        onclick: () => photoColour(bgPhoto).then(hex => { if (!hex) { toast("Could not find a strong colour in that photo."); return; } setAccent({ id: "custom", hex: hex }); toast("Theme matched to your photo"); }) }) : null,
      switchRow("Tint backgrounds", "Blend the theme colour into the app background", tintOn, v => { tintOn = v; store.set("aps.tint", v); applyAccent(); }, "sw-tint")));
  }
  applyAccent();
  loadPhoto();

  /* ---------- Boot ---------- */
  const ROOTS = { learn: renderLearn, practice: renderPractice, progress: renderProgress, settings: renderSettings };
  buildIndex();
  applyGlass();
  guardStart();
  switchTab("learn");
  GL.warm([[240, 44, 22, "menu"], [300, 44, 22, "menu"], [380, 230, 22, "alert"]]);
  watchSlow();
  if (crashedLastRun && glassRender === "auto" && glassStyle === "glass") toast("Glass had trouble starting last time, so a lighter look is on.");
  fullscreenPrompt();
  /* Android back button (called by the APK). Closes a dialog, goes back a
     screen, or returns to Learn. Returns false when there is nothing left,
     so the APK lets Android leave the app. */
  window.apsBack = function () {
    const scrim = document.querySelector(".fs-scrim");
    if (scrim) { const no = scrim.querySelector(".btn.plain"); if (no) no.click(); else scrim.remove(); return true; }
    if (stack.length > 1) { pop(); return true; }
    if (tab !== "learn") { switchTab("learn"); return true; }
    return false;
  };
  window.__apsTest = {
    index: () => index, validate: validateCourse, store: store, library: () => ({ active: activeId, list: library.slice() }), prompt: aiPrompt,
    mobile: () => isMobile, fullscreen: () => isFull(), motion: () => ({ pref: motionPref, reduce: reduceMotion }),
    glass: () => ({ mode: glassMode(), reason: lastReason, cls: deviceClass(), stepDown: stepDown, crashed: crashedLastRun, canRefract: canRefract, filters: GL.count(), light: lightDeg, dev: Object.assign({}, dev), slow: { hz: slow.hz, budget: slow.budget, strikes: slow.strikes, on: slow.on } }),
    lastHaptic: () => lastHaptic, tab: () => tab, depth: () => stack.length,
    simulateSlow: () => { slow.on = false; askSlow(); }
  };
})();
