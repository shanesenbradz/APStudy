<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F9F9FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A+ Study">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>A+ Study Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free CompTIA A+ Core 1 and Core 2 study app: lessons, flashcards and quizzes. Works offline.">
<style>
/* Layout: one centred iOS-style column, large titles, inset grouped lists, fixed bottom tab bar. */
:root {
  --bg: #F2F2F6;
  --card: #FFFFFF;
  --fill: #E8E8ED;
  --fg: #121216;
  --fg2: #66666E;
  --sep: #D8D8DE;
  --accent: #0A62CC;
  --on-accent: #FFFFFF;
  --good: #1D7F38;
  --good-bg: #E3F3E7;
  --bad: #C02B24;
  --bad-bg: #FBE6E4;
  --bar: #F9F9FB;
  --scrim: rgba(0, 0, 0, .4);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --tabh: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fg: #F4F4F6; --fg2: #9C9CA3; --sep: #38383B;
    --accent: #4A9BFF; --on-accent: #001A3A; --good: #43C467; --good-bg: #12301B; --bad: #FF6259; --bad-bg: #3A1513; --bar: #121214;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fg: #F4F4F6; --fg2: #9C9CA3; --sep: #38383B;
  --accent: #4A9BFF; --on-accent: #001A3A; --good: #43C467; --good-bg: #12301B; --bad: #FF6259; --bad-bg: #3A1513; --bar: #121214;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font);
  font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

#app { position: relative; min-height: 100%; }
.screen {
  min-height: 100vh; padding-bottom: calc(var(--tabh) + 40px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
}
.screen.anim-push { animation: push .32s cubic-bezier(.2,.8,.2,1); }
.screen.anim-pop { animation: pop .28s cubic-bezier(.2,.8,.2,1); }
.screen.anim-fade { animation: fade .2s ease-out; }
@keyframes push { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateX(-25%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .screen.anim-push, .screen.anim-pop, .screen.anim-fade, .flip-inner { animation: none !important; transition: none !important; } }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Navigation bar */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar);
  border-bottom: 1px solid var(--sep);
}
.nav .wrap { display: flex; align-items: center; min-height: 48px; gap: 8px; }
.nav .back {
  background: none; border: 0; color: var(--accent); padding: 8px 4px; display: flex; align-items: center; gap: 2px;
  font-size: 17px; min-width: 0; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav .back svg { flex: none; }
.nav .ntitle { flex: 1; text-align: center; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav .spacer { width: 60px; flex: none; }

.head { padding-top: 22px; padding-bottom: 6px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg2); }
.large { font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
.sub { color: var(--fg2); margin: 6px 0 0; font-size: 16px; max-width: 62ch; }

/* Grouped lists */
.group-label { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg2); margin: 26px 16px 7px; }
.group { background: var(--card); border-radius: var(--r); overflow: hidden; }
.group + .note { margin: 7px 16px 0; font-size: 13px; color: var(--fg2); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; background: none; border: 0;
  text-align: left; min-height: 48px; position: relative; text-decoration: none; color: var(--fg);
}
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; border-top: 1px solid var(--sep); }
.row.has-tile + .row.has-tile::before { left: 62px; }
button.row:active, a.row:active { background: var(--fill); }
.row .main { flex: 1; min-width: 0; }
.row .t { font-size: 17px; overflow-wrap: anywhere; }
.row .d { font-size: 14px; color: var(--fg2); margin-top: 1px; }
.row .v { color: var(--fg2); font-size: 15px; font-variant-numeric: tabular-nums; flex: none; }
.row .chev { color: var(--fg2); flex: none; opacity: .6; }
.row.destructive .t { color: var(--bad); }
.row.action .t { color: var(--accent); }
.tile {
  width: 34px; height: 34px; border-radius: 8px; flex: none; display: grid; place-items: center;
  color: #FFFFFF; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums;
}
.mini-bar { height: 4px; background: var(--fill); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.mini-bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }

/* Summary card */
.summary { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 16px; display: grid; gap: 12px; }
.summary .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.summary .row2 { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar { height: 8px; background: var(--fill); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--fill); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--fg2); }

/* Segmented control */
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-top: 18px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 6px; border-radius: 7px; font-size: 15px; font-weight: 500; color: var(--fg); min-width: 0; }
.seg button[aria-selected="true"] { background: var(--card); font-weight: 600; box-shadow: 0 0 0 1px var(--sep); }

/* Learn content */
.section { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 14px; }
.section h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); display: flex; align-items: center; gap: 8px; }
.section h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--sec, var(--accent)); flex: none; }
.section p { margin: 0; max-width: 65ch; }
.section ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 65ch; }
.section.lead p { font-size: 19px; line-height: 1.45; }
.memory { font-weight: 600; }
.table-wrap { overflow-x: auto; margin: 4px -4px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--sep); vertical-align: top; }
th { font-size: 13px; color: var(--fg2); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
tr:last-child td { border-bottom: 0; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: var(--r);
  padding: 14px 16px; font-size: 17px; font-weight: 600; background: var(--accent); color: var(--on-accent); min-height: 50px;
}
.btn.secondary { background: var(--card); color: var(--accent); }
.btn.plain { background: var(--fill); color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: grid; gap: 10px; margin-top: 16px; }
.btns.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* Flashcards */
.flip { margin-top: 18px; perspective: 1200px; cursor: pointer; }
.flip-inner { position: relative; min-height: 260px; transition: transform .45s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; display: grid; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border-radius: 16px;
  padding: 28px 22px; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 260px; border: 2px solid transparent;
}
.face.back { transform: rotateY(180deg); border-color: var(--sec, var(--accent)); }
.face .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg2); }
.face .txt { font-size: 24px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.face.back .txt { font-weight: 500; font-size: 22px; }
.counter { text-align: center; color: var(--fg2); margin-top: 12px; font-variant-numeric: tabular-nums; font-size: 15px; }

/* Quiz */
.qprog { display: flex; align-items: center; gap: 10px; padding-top: 14px; }
.qprog .bar { flex: 1; height: 6px; }
.qprog span { font-size: 14px; color: var(--fg2); font-variant-numeric: tabular-nums; flex: none; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.chip { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 6px; background: var(--fill); color: var(--fg2); }
.chip.retry { background: var(--bad-bg); color: var(--bad); }
.qtext { font-size: 22px; line-height: 1.35; font-weight: 600; margin: 10px 0 0; max-width: 65ch; overflow-wrap: anywhere; }
.hint { font-size: 14px; color: var(--fg2); margin-top: 6px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 2px solid transparent;
  border-radius: var(--r); padding: 13px 14px; font-size: 17px; min-height: 52px;
}
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--fill); display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--fg2); }
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 1px; }
.opt.sel { border-color: var(--accent); }
.opt.sel .k { background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k { background: var(--good); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: var(--card); }
.opt:disabled { cursor: default; color: var(--fg); }

.mrow { background: var(--card); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; border: 2px solid transparent; }
.mrow .ml { font-weight: 600; overflow-wrap: anywhere; }
.mrow select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--sep); background: var(--bg); min-width: 0; }
.mrow.right { border-color: var(--good); }
.mrow.wrong { border-color: var(--bad); }
.mrow .fix { font-size: 14px; color: var(--good); font-weight: 600; }

.orow { background: var(--card); border-radius: var(--r); padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; }
.orow .n { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--fill); display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--fg2); font-variant-numeric: tabular-nums; }
.orow .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.orow .mv { display: flex; gap: 4px; flex: none; }
.orow .mv button { width: 40px; height: 40px; border: 0; border-radius: 9px; background: var(--fill); color: var(--fg); display: grid; place-items: center; }
.orow .mv button:disabled { opacity: .3; cursor: default; }
.orow.right { border-color: var(--good); }
.orow.wrong { border-color: var(--bad); }

.calc { display: flex; gap: 10px; align-items: center; background: var(--card); border-radius: var(--r); padding: 10px 14px; margin-top: 18px; }
.calc input { flex: 1; min-width: 0; border: 0; background: none; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 6px 0; outline: none; }
.calc .unit { color: var(--fg2); flex: none; }
.calc.right { box-shadow: inset 0 0 0 2px var(--good); }
.calc.wrong { box-shadow: inset 0 0 0 2px var(--bad); }

.feedback { margin-top: 18px; border-radius: var(--r); padding: 16px; background: var(--card); border-left: 5px solid var(--fg2); }
.feedback.good { border-left-color: var(--good); }
.feedback.bad { border-left-color: var(--bad); }
.feedback .verdict { font-weight: 700; font-size: 19px; }
.feedback.good .verdict { color: var(--good); }
.feedback.bad .verdict { color: var(--bad); }
.feedback .ans { margin-top: 6px; font-weight: 600; }
.feedback p { margin: 8px 0 0; max-width: 65ch; }
.feedback ol { margin: 8px 0 0; padding-left: 22px; }
.kbd { font-size: 13px; color: var(--fg2); text-align: center; margin-top: 10px; }

.result-num { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 18px; }
.missed { margin-top: 10px; }

/* Settings */
textarea { width: 100%; min-height: 180px; border: 0; border-radius: var(--r); background: var(--card); padding: 12px 14px; font-family: var(--mono); font-size: 13px; line-height: 1.45; resize: vertical; display: block; }
.errors { margin-top: 12px; background: var(--bad-bg); color: var(--bad); border-radius: var(--r); padding: 12px 16px; font-size: 14px; }
.errors ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.errors li { overflow-wrap: anywhere; }
.confirm { display: grid; gap: 10px; padding: 12px 16px 16px; }
.confirm p { margin: 0; font-size: 15px; color: var(--fg2); }
.empty { text-align: center; color: var(--fg2); padding: 30px 16px; background: var(--card); border-radius: var(--r); margin-top: 16px; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bar); border-top: 1px solid var(--sep);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--tabh); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--fg2); font-size: 11px; font-weight: 500; min-width: 0; }
.tabbar button[aria-selected="true"] { color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabh) + 18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 40; max-width: calc(100% - 32px);
  text-align: center;
}

@media (min-width: 900px) {
  .large { font-size: 40px; }
  .qtext { font-size: 26px; }
  .opt { font-size: 19px; }
}

/* Full screen prompt */
.fs-scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; animation: fade .2s ease-out; }
.fs-card { background: var(--card); border-radius: 16px; padding: 22px 20px 20px; width: 100%; max-width: 380px; display: grid; gap: 14px; }
.fs-card h2 { margin: 0; font-size: 22px; }
.fs-card p { margin: 0; color: var(--fg2); font-size: 16px; }
@media (prefers-reduced-motion: reduce) { .fs-scrim { animation: none; } }

</style>
</head>

<script id="course-data">
/* =====================================================================
   COURSE DATA  —  edit or replace this block only.
   The app reads nothing else. Every module is one COURSE.modules.push().
   Helpers below build each question type:
     mc(question, [options], answerIndex | [indexes], explanation)
     tf(statement, true|false, explanation)
     match(question, [[left, right], ...], explanation)
     order(question, [steps in the correct order], explanation)
     calc(question, numberAnswer, explanation, {unit, tolerance})
     card(front, back)
   ===================================================================== */
const mc = (q, options, answer, explain) => ({ type: "mc", q, options, answer, explain });
const tf = (q, answer, explain) => ({ type: "tf", q, answer, explain });
const match = (q, pairs, explain) => ({ type: "match", q, pairs, explain });
const order = (q, steps, explain) => ({ type: "order", q, steps, explain });
const calc = (q, answer, explain, opts) => ({ type: "calc", q, answer, explain, unit: (opts && opts.unit) || "", tolerance: (opts && opts.tolerance) || 0 });
const card = (front, back) => ({ front, back });

const COURSE = {
  title: "A+ Study Lab",
  subtitle: "CompTIA A+ Core 1 (220-1201) and Core 2 (220-1202)",
  version: 1,
  channel: { name: "Watch the video lessons", url: "https://www.youtube.com/" },
  note: "Original practice content written for beginners. Not affiliated with CompTIA. Check the official exam objectives before you book.",
  modules: []
};


/* ---------- MODULE 1: Mobile Devices (Core 1, 13%) ---------- */
COURSE.modules.push({
  id: "mobile", title: "Mobile Devices", exam: "Core 1 · Domain 1", color: "#C2410C",
  concepts: [
    {
      id: "laptop-hw", title: "Laptop Hardware",
      learn: {
        idea: "Laptops use the same parts as desktops, but smaller. Many parts can be swapped. Some are soldered to the board and cannot.",
        points: [
          "Laptop RAM uses SO-DIMM modules. DDR4 SO-DIMM has 260 pins. DDR5 SO-DIMM has 262 pins.",
          "Most new laptops use M.2 SSDs. Older ones use 2.5-inch SATA drives.",
          "Common replaceable parts: battery, keyboard, RAM, storage, wireless card, fans.",
          "Always remove power and the battery before you open a laptop. Ground yourself first.",
          "Keep screws in order. Laptops use many screw sizes, and a long screw in the wrong hole can crack the board."
        ],
        analogy: "A laptop is like a packed suitcase. Everything fits, but only in one exact way. Take photos as you unpack it.",
        example: "A user says their laptop is slow with many browser tabs open. It has 8 GB of RAM in one SO-DIMM slot and one empty slot. You add a matching 8 GB SO-DIMM and the slowdowns stop.",
        memory: "SO-DIMM = Small Outline. Small laptop, small stick.",
        table: { head: ["Part", "Desktop", "Laptop"], rows: [["RAM", "DIMM (288 pins DDR4/DDR5)", "SO-DIMM (260 DDR4 / 262 DDR5)"], ["Storage", "3.5\" HDD, 2.5\" SSD, M.2", "2.5\" SSD/HDD, M.2"], ["Power", "Internal ATX PSU", "Battery + external adapter"]] }
      },
      cards: [
        card("What memory form factor do laptops use?", "SO-DIMM (Small Outline DIMM)."),
        card("First step before opening a laptop?", "Unplug power, remove the battery if you can, and ground yourself."),
        card("Two common laptop SSD types?", "M.2 (SATA or NVMe) and 2.5-inch SATA."),
        card("How many pins on a DDR5 SO-DIMM?", "262 pins.")
      ],
      questions: [
        mc("A technician is upgrading memory in a laptop. Which module type should they buy?", ["DIMM", "SO-DIMM", "RIMM", "SIMM"], 1, "Laptops use the smaller SO-DIMM form factor. Desktops use full-size DIMMs."),
        mc("A user wants a faster boot drive in a thin laptop that has an M.2 slot with an M key. Which drive gives the best speed?", ["2.5-inch SATA HDD", "M.2 SATA SSD", "M.2 NVMe SSD", "eMMC card"], 2, "NVMe uses PCIe lanes and is much faster than SATA. The M key slot usually supports NVMe."),
        tf("You should leave the laptop plugged in while replacing the keyboard so it stays grounded.", false, "Never work on a powered device. Unplug it and remove the battery. Use an ESD strap for grounding."),
        match("Match each laptop part to its job.", [["Digitizer", "Turns touch into input"], ["Inverter", "Powers an old CCFL backlight"], ["Wi-Fi antenna", "Usually runs through the display lid"], ["SO-DIMM", "Holds system memory"]], "The lid holds the screen, antennas, webcam and mic. The inverter only exists on older CCFL screens."),
        order("Put these laptop repair steps in order.", ["Power off and unplug the laptop", "Remove the battery and ground yourself", "Remove the panel and keep screws organised", "Replace the part", "Reassemble and test"], "Safety first, then document the screws, then swap the part, then test.")
      ]
    },
    {
      id: "mobile-display", title: "Mobile Displays",
      learn: {
        idea: "Phones and laptops use LCD or OLED screens. Each type has different strengths and failure signs.",
        points: [
          "LCD needs a backlight. Types are IPS (best colour and angles), TN (fast, poor angles) and VA (good contrast).",

        h("p", { text: "Full screen hides the browser bars so the lessons and quizzes fill the page. Press Esc to leave it." }),
        h("div", { class: "btns two", style: "margin-top:0" }, no, yes)));
    document.body.appendChild(sheet);
    keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); close(); enterFull(); } else if (e.key === "Escape") { e.preventDefault(); close(); } };
    try { yes.focus({ preventScroll: true }); } catch (e) {}
  }

  /* ---------- Boot ---------- */
  const ROOTS = { learn: renderLearn, practice: renderPractice, progress: renderProgress, settings: renderSettings };
  buildIndex();
  switchTab("learn");
  fullscreenPrompt();
  window.__apsTest = { index: () => index, validate: validateCourse, store: store };
})();

</script>

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
