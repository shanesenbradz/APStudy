# Publishes a GitHub Release with the APK attached whenever a version tag
# (like v3.4) is pushed. Release notes come from .github/release-notes.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" APStudy.apk \
            --title "A+ Study Lab ${TAG#v}" \
            --notes-file .github/release-notes.md \
            --latest
