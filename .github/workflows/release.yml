# Publishes a GitHub Release with the APK attached.
# Runs when APStudy.apk or the release notes change on main (or by hand from
# the Actions tab). The version comes from versionName in android/apktool.yml,
# and a version that already has a release is skipped.
name: Release

on:
  push:
    branches: [main]
    paths:
      - APStudy.apk
      - .github/release-notes.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E "^\s*versionName:" android/apktool.yml | sed -E "s/.*versionName:\s*'?([^']*)'?.*/\1/")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Raise versionName in android/apktool.yml for a new one."
            exit 0
          fi
          gh release create "$TAG" APStudy.apk \
            --target "$GITHUB_SHA" \
            --title "A+ Study Lab $VERSION" \
            --notes-file .github/release-notes.md \
            --latest
